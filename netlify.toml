[build]
  base = "apps/web"
  command = "pnpm --filter @tabletap/shared build && pnpm --filter @tabletap/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_DEMO_MODE = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
